    - title: "Compiler-Research: State of the Union"
      speaker:
        name: "Vassil Vassilev"
        bio: |
          Dr. Vassil Vassilev is a seasoned compiler engineer and research
          software consultant with extensive experience in building large-scale
          programming-language infrastructure and leading technical teams. He
          specializes in programming languages, compiler-based automatic
          differentiation, dynamic C++/Python interoperability, and is a code
          owner of key Clang components. Vassil chairs the Bulgarian delegation
          to ISO/JTC1/SC22, contributing to C++ standardization, and is
          dedicated to advancing reliable, sustainable open-source software for
          high-performance scientific computing while mentoring early-career
          researchers.
      time_cest: "17:30 - 17:55"
      description: |
        In this talk we will make an overview of the various activities around
        the compiler research initiative in terms of people, projects, code and
        impact. We will outline our aspirational plans and perspective for 2027.

